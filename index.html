
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MyAppStore</title>
<style>
body {
  margin: 0;
  padding: 30px 20px;
  font-family: Arial, sans-serif;
  background: #f5f6fa;
  color: #202124;
}
main { max-width: 800px; margin: auto; }
h1 { font-size: 32px; }
p { color: #666; }
input {
  width: 100%;
  padding: 14px;
  box-sizing: border-box;
  border: 1px solid #ddd;
  border-radius: 12px;
  font-size: 16px;
  margin: 20px 0;
}
.apps {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 16px;
}
.card {
  background: white;
  padding: 20px;
  border-radius: 16px;
  border: 1px solid #eee;
}
.icon { font-size: 38px; }
button {
  width: 100%;
  padding: 12px;
  border: 0;
  border-radius: 10px;
  background: #1769e0;
  color: white;
  cursor: pointer;
}
</style>
</head>
<body>
<main>
  <h1>MyAppStore</h1>
  <p>Мой личный магазин приложений</p>
  <input id="search" placeholder="Поиск приложений...">
  <div class="apps" id="apps"></div>
</main>
<script>
const apps = [
  {name:"Мои приложения", icon:"📱", version:"1.0", description:"Личная коллекция приложений."},
  {name:"Инструменты", icon:"🧰", version:"1.0", description:"Полезные инструменты и ссылки."},
  {name:"Тестовое приложение", icon:"🧪", version:"1.0", description:"Проверка работы магазина."},
  {name:"Umhanov Tools", icon:"🔐", version:"1.0", description:"Генератор надёжных паролей.", link:"tools.html"},
  {name:"YouTube", icon:"▶️", version:"Официальное приложение", description:"Смотри видео на YouTube.", link:"https://apps.apple.com/gr/app/youtube/id544007664"},
];

function render() {
  const query = document.getElementById("search").value.toLowerCase();
  document.getElementById("apps").innerHTML = apps
    .filter(a => (a.name + a.description).toLowerCase().includes(query))
    .map(a => `<div class="card">
      <div class="icon">${a.icon}</div>
      <h3>${a.name}</h3>
      <p>Версия ${a.version}</p>
      <p>${a.description}</p>
      `<button onclick="${a.name === 'Umhanov Tools' ? "location.href='tools.html'" : a.name === 'YouTube' ? "window.open('https://apps.apple.com/gr/app/youtube/id544007664','_blank','noopener')" : "alert('Каталог работает! Установку подключим позже.')"}">Подробнее</button>`
    </div>`).join("");
}
document.getElementById("search").addEventListener("input", render);
render();
</script>
</body>
</html>
